services:
  - type: web
    name: anavya-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build && (npx prisma db push --skip-generate || echo "prisma db push skipped - set DATABASE_URL")
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_MOCK_MODE
        value: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
